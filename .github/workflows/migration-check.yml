name: Migration web checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [migration/tauri2-cross-platform]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Assert production assets exist
        run: |
          test -s dist/index.html
          grep -q 'Inbox Reborn' dist/index.html
          test -f index.html
