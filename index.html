/* Tinder-style triage deck — four-direction swipe cards */
.triage-deck{display:flex;flex-direction:column;align-items:center;padding:18px 12px 8px;max-width:480px;margin:0 auto}
.deck-stack{position:relative;width:100%;max-width:400px;height:430px}
.deck-card{position:absolute;inset:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadowbig);overflow:hidden;will-change:transform}
.deck-top{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.deck-top:active{cursor:grabbing}
.deck-back{pointer-events:none}
.deck-card-body{padding:22px;height:100%;display:flex;flex-direction:column;box-sizing:border-box}
.deck-card-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.deck-avatar{width:46px;height:46px;border-radius:50%;color:#fff;font-weight:750;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.deck-id{flex:1;min-width:0;display:flex;flex-direction:column}
.deck-id strong{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-id span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-card-head time{font-size:11px;color:var(--muted);flex-shrink:0}
.deck-subject{font-size:19px;letter-spacing:-.3px;color:var(--ink);margin:0 0 10px;line-height:1.35}
.deck-snippet{font-size:13.5px;color:var(--muted);line-height:1.65;margin:0;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical}
.deck-meta{display:flex;gap:8px;align-items:center;margin-top:14px}
.deck-unread{font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:1.2px;color:var(--blue);background:var(--accent);border-radius:7px;padding:4px 8px}
.deck-bundle{font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.deck-stamp{position:absolute;top:16px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px;border:2.5px solid;border-radius:10px;padding:7px 12px;pointer-events:none;z-index:5;background:color-mix(in srgb,var(--paper) 82%,transparent)}
.stamp-left{left:16px;color:var(--red);border-color:var(--red);transform:rotate(-9deg)}
.stamp-right{right:16px;color:var(--green);border-color:var(--green);transform:rotate(9deg)}
.stamp-up{left:50%;transform:translateX(-50%);color:var(--blue);border-color:var(--blue)}
.stamp-down{left:50%;top:auto;bottom:18px;transform:translateX(-50%);color:#e8933c;border-color:#e8933c}
.deck-actions{display:flex;gap:14px;margin-top:20px}
.deck-btn{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.deck-btn span{font-size:8.5px}
.deck-btn:active{transform:scale(.93)}
.deck-btn-left{color:var(--red)}.deck-btn-right{color:var(--green)}.deck-btn-up{color:var(--blue)}.deck-btn-down{color:#e8933c}
.deck-hint{font-size:11px;color:var(--muted);margin:12px 0 4px;text-align:center}
.deck-empty{padding:75px 20px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:17px;max-width:480px;margin:18px auto}
.deck-empty h3{font-size:20px;letter-spacing:-.5px;color:var(--ink);margin:0 0 8px}
.deck-empty p{font-size:13px;max-width:390px;line-height:1.6;margin:0 auto}
@media (max-width:520px){.deck-stack{height:400px}.deck-btn{width:58px;height:58px}}
/*$vite$:1*/</style>
  </head>

    <div id="root"></div>
  </body>
